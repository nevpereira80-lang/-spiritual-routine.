name: Update meeting material

on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * *"
      timezone: "America/New_York"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch current JW.org material
        run: node update-material.mjs

      - name: Commit update if changed
        run: |
          git config user.name "spiritual-routine-bot"
          git config user.email "actions@users.noreply.github.com"
          git add meeting-data.js
          if git diff --cached --quiet; then
            echo "No meeting-data changes."
          else
            git commit -m "Update weekly meeting material"
            git push
          fi
